name: OpenJarvis Main Signed Desktop Updates

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'src/openjarvis/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'scripts/build-armenian-desktop.ps1'
      - '.github/workflows/main-desktop-signed.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: openjarvis-main-signed-desktop
  cancel-in-progress: false

jobs:
  signed-windows-x64:
    # Only release signed owner-controlled binaries.
    if: ${{ vars.TAURI_SIGNING_PUBLIC_KEY != '' }}
    runs-on: windows-latest
    timeout-minutes: 100
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: desktop-main
    steps:
      - uses: actions/checkout@v4
      - name: Require signing keys
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw "Missing TAURI_SIGNING_PRIVATE_KEY repository secret" }
          if (-not $env:TAURI_PUBLIC_KEY) { throw "Missing TAURI_SIGNING_PUBLIC_KEY repository variable" }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install reviewed npm
        run: npm install --global npm@11.19.0
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Frontend tests
        working-directory: frontend
        run: npm test
      - name: Frontend build
        working-directory: frontend
        run: npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target
      - name: Prepare release Tauri frontend for Rust tests
        working-directory: frontend
        run: npm run build:tauri:armenian-release
      - name: Confirm frontend dist exists
        shell: pwsh
        run: |
          if (-not (Test-Path "frontend/dist/index.html")) { throw "Missing frontend/dist/index.html" }
      - name: Desktop Rust tests
        working-directory: frontend/src-tauri
        run: cargo test --lib --features armenian-preview
      - name: Configure Tauri signed main channel
        shell: pwsh
        env:
          BUILD_VERSION: 1.1.${{ github.run_number }}
        run: |
          $config = Get-Content "frontend/src-tauri/tauri.armenian-preview.conf.json" -Raw | ConvertFrom-Json -AsHashtable
          $config["version"] = $env:BUILD_VERSION
          $config["bundle"]["createUpdaterArtifacts"] = $true
          $config["build"]["beforeBuildCommand"] = "npm run build:tauri:armenian-release"
          $config["plugins"]["updater"]["pubkey"] = $env:TAURI_PUBLIC_KEY
          $config["plugins"]["updater"]["requireSignedVersion"] = $true
          $config["plugins"]["updater"]["windows"] = @{ installMode = "passive" }
          $config["plugins"]["updater"]["endpoints"] = @("https://github.com/GorDev11/OpenJarvis/releases/download/desktop-main/latest.json")
          $config | ConvertTo-Json -Depth 30 | Set-Content "frontend/src-tauri/tauri.main-signed.generated.json" -Encoding utf8
      - name: Build signed NSIS updater
        working-directory: frontend
        run: npx tauri build --bundles nsis --config src-tauri/tauri.main-signed.generated.json
      - name: Generate latest.json
        shell: pwsh
        env:
          BUILD_VERSION: 1.1.${{ github.run_number }}
        run: |
          $dir = "frontend/src-tauri/target/release/bundle/nsis"
          # Tauri v2 createUpdaterArtifacts=true signs the NSIS .exe itself.
          $installer = Get-ChildItem $dir -Filter '*.exe' -File | Select-Object -First 1
          if (-not $installer) { throw "Missing NSIS installer" }
          # Tauri emits "OpenJarvis Armenian Preview_...exe" while GitHub
          # release upload normalizes spaces to dots. Previously latest.json
          # pointed at %20-separated names and the updater always got HTTP 404.
          # Name the local payload and its detached signature exactly as they
          # will appear in the release BEFORE constructing the signed manifest.
          $safeName = $installer.Name -replace ' ', '.'
          if ($safeName -ne $installer.Name) {
            $signatureOriginal = "$($installer.FullName).sig"
            if (-not (Test-Path -LiteralPath $signatureOriginal)) { throw "Missing installer signature" }
            Rename-Item -LiteralPath $signatureOriginal -NewName "$safeName.sig"
            Rename-Item -LiteralPath $installer.FullName -NewName $safeName
            $installer = Get-Item -LiteralPath (Join-Path $dir $safeName)
          }
          if ($installer.Name -match '\s') { throw "Installer filename still contains whitespace" }
          $signatureFile = "$($installer.FullName).sig"
          if (-not (Test-Path -LiteralPath $signatureFile)) { throw "Missing installer signature" }
          $signature = (Get-Content $signatureFile -Raw).Trim()
          if (-not $signature) { throw "Empty signature" }
          $asset = [Uri]::EscapeDataString($installer.Name)
          $url = "https://github.com/GorDev11/OpenJarvis/releases/download/$env:RELEASE_TAG/$asset"
          $manifest = @{
            version = $env:BUILD_VERSION
            notes = "OpenJarvis main $env:GITHUB_SHA"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              'windows-x86_64' = @{
                signature = $signature
                url = $url
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 10 | Set-Content "$dir/latest.json" -Encoding utf8
      - name: Verify manifest and signed updater payload
        shell: pwsh
        env:
          BUILD_VERSION: 1.1.${{ github.run_number }}
        run: |
          $dir = "frontend/src-tauri/target/release/bundle/nsis"
          $installers = @(Get-ChildItem $dir -Filter "*.exe" -File)
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS installer" }
          $exe = $installers[0]
          if ($exe.Name -match '\s') { throw "Installer filename is not GitHub release safe" }
          $signatureFile = "$($exe.FullName).sig"
          if (-not (Test-Path $signatureFile)) { throw "Unsigned NSIS executable" }
          $manifest = Get-Content "$dir/latest.json" -Raw | ConvertFrom-Json
          if ($manifest.version -ne $env:BUILD_VERSION) { throw "Manifest version mismatch" }
          $entry = $manifest.platforms.'windows-x86_64'
          if (-not $entry) { throw "Missing windows-x86_64 target" }
          if ($entry.signature -ne (Get-Content $signatureFile -Raw).Trim()) { throw "Signature mismatch" }
          $expectedUrl = "https://github.com/GorDev11/OpenJarvis/releases/download/desktop-main/$([Uri]::EscapeDataString($exe.Name))"
          if ($entry.url -ne $expectedUrl) { throw "Updater asset URL mismatch" }
          Write-Host "Signed update manifest validated for $env:BUILD_VERSION"
      - name: Publish owner-signed rolling release
        shell: bash
        run: |
          set -euo pipefail
          dir="frontend/src-tauri/target/release/bundle/nsis"
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "OpenJarvis Main Desktop" --notes "Signed, opt-in desktop updates from main." --prerelease
          fi
          shopt -s nullglob
          installers=("$dir"/*.exe)
          if [ "${#installers[@]}" -ne 1 ]; then echo "::error::Missing signed installer"; exit 1; fi
          installer="${installers[0]}"
          if [ ! -f "$installer.sig" ]; then echo "::error::Missing updater signature"; exit 1; fi
          gh release upload "$RELEASE_TAG" "$installer" "$installer.sig" --repo "$GITHUB_REPOSITORY" --clobber
          # The Release API must list exactly the filename in latest.json.
          # GitHub silently rewrites whitespace in asset names, so a normal
          # upload succeeding does NOT prove that the updater URL will work.
          uploaded_name="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq '.assets[] | select(.name == "'"$(basename "$installer")"'") | .name')"
          if [ "$uploaded_name" != "$(basename "$installer")" ]; then
            echo "::error::Release asset filename differs from latest.json"; exit 1
          fi
          # Verify the public, unauthenticated download and its exact bytes.
          # If GitHub returns a 404 or corrupt payload, keep the previous
          # latest.json rather than advertising a broken signed update.
          download_url="$(python -c 'import json,sys; p=json.load(open(sys.argv[1],encoding="utf-8-sig")); print(p["platforms"]["windows-x86_64"]["url"])' "$dir/latest.json")"
          curl --fail --location --retry 6 --retry-all-errors --retry-delay 3 \
            --silent --show-error --output "$RUNNER_TEMP/openjarvis-update-public.exe" "$download_url"
          if ! cmp -s "$installer" "$RUNNER_TEMP/openjarvis-update-public.exe"; then
            echo "::error::Public updater download differs from signed installer"; exit 1
          fi
          # The manifest is published LAST, only after the payload is proven
          # reachable and byte-identical. Tauri verifies its signature on install.
          gh release upload "$RELEASE_TAG" "$dir/latest.json" --repo "$GITHUB_REPOSITORY" --clobber
